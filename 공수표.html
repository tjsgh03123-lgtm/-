<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>공수표</title>

<!-- PWA & Mobile Optimization -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E2A33">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231E2A33'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='%23C97A2E'>工</text></svg>">

<!-- Manifest Data URI -->
<link rel="manifest" id="pwaManifest">

<style>
  :root{
    --steel-dark:#1E2A33;
    --steel:#2E404C;
    --steel-light:#3E5462;
    --paper:#EDEAE0;
    --paper-light:#F6F4EC;
    --line:#C7C0AE;
    --ink:#1C2226;
    --muted:#7C7666;
    --day:#4A7C59;
    --day-bg:#E1EBE3;
    --ot:#C97A2E;
    --ot-bg:#F3E3CE;
    --night:#33506E;
    --night-bg:#DCE4EC;
    --half:#7A6A8C;
    --half-bg:#E7E1EC;
    --danger:#B5482A;
  }
  *{box-sizing:border-box; touch-action: manipulation;}
  html{-webkit-text-size-adjust:100%;}
  button,.day-cell,.picker-opt,.picker-clear,.picker-cancel{-webkit-tap-highlight-color:transparent;}
  body{overscroll-behavior-x:none; user-select: none; -webkit-user-select: none;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--steel-dark);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    padding:20px 10px 60px;
  }
  .sheet{
    max-width:600px;
    margin:0 auto;
    background:var(--paper);
    border-radius:3px;
    box-shadow:0 18px 50px rgba(0,0,0,0.5);
    overflow:hidden;
  }

  /* Header */
  .header{
    background:var(--steel);
    color:var(--paper-light);
    padding:20px 22px 16px;
    position:relative;
    border-bottom:4px solid var(--ot);
  }
  .header-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .title{
    font-family:Georgia,'Times New Roman',serif;
    font-size:24px;
    letter-spacing:1px;
    margin:0;
  }
  .title .en{
    font-family:'Courier New',monospace;
    font-size:11px;
    color:#9FB0BC;
    letter-spacing:2px;
    display:block;
    margin-top:2px;
  }
  .legend{
    display:flex;
    gap:10px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    color:#CBD5DB;
    font-family:'Courier New',monospace;
  }
  .legend-dot{
    width:9px;height:9px;border-radius:2px;
  }
  .legend-dot.day{background:var(--day);}
  .legend-dot.ot{background:var(--ot);}
  .legend-dot.night{background:var(--night);}
  .legend-dot.half{background:var(--half);}

  /* Month nav */
  .month-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    background:var(--paper-light);
    border-bottom:1px solid var(--line);
  }
  .month-nav button{
    background:none;
    border:1px solid var(--line);
    color:var(--ink);
    width:36px;height:36px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
    font-family:Georgia,serif;
  }
  .month-nav button:disabled{opacity:0.25;cursor:default;}
  .month-nav button:not(:disabled):active{background:var(--paper);}
  .month-label{
    font-family:Georgia,serif;
    font-size:19px;
    text-align:center;
  }

  /* Total strip */
  .total-strip{
    padding:16px 22px;
    background:repeating-linear-gradient(var(--paper-light),var(--paper-light) 26px,var(--line) 27px);
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .total-strip .label{
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.5px;
  }
  .total-strip .value{
    font-family:'Courier New',monospace;
    font-size:30px;
    font-weight:bold;
    color:var(--steel);
  }
  .total-strip .value .unit{
    font-size:14px;
    color:var(--muted);
    font-weight:normal;
    margin-left:4px;
  }
  .total-breakdown{
    display:flex;
    gap:14px;
    font-family:'Courier New',monospace;
    font-size:11px;
    color:var(--muted);
  }
  .total-breakdown span b{color:var(--ink);}

  /* Calendar grid */
  .calendar{
    padding:18px 16px 24px;
  }
  .dow-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:6px;
  }
  .dow-row div{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    font-family:'Courier New',monospace;
    letter-spacing:0.5px;
  }
  .dow-row div:first-child{color:var(--danger);}
  .day-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
  }
  .day-cell{
    aspect-ratio:1;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--paper-light);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    transition:transform .1s;
    padding:2px;
  }
  .day-cell:active{transform:scale(0.94);}
  .day-cell.empty{
    border:none;background:none;cursor:default;
  }
  .day-cell .num{
    font-size:12px;
    color:var(--ink);
    font-family:'Courier New',monospace;
  }
  .day-cell.sunday .num{color:var(--danger);}
  .day-cell.today{
    box-shadow:0 0 0 2px var(--steel) inset;
  }
  .day-cell .tag{
    font-size:9.5px;
    margin-top:2px;
    padding:1px 5px;
    border-radius:8px;
    font-weight:600;
    letter-spacing:0.3px;
  }
  .day-cell.filled.day{background:var(--day-bg);}
  .day-cell.filled.day .tag{background:var(--day);color:#fff;}
  .day-cell.filled.ot{background:var(--ot-bg);}
  .day-cell.filled.ot .tag{background:var(--ot);color:#fff;}
  .day-cell.filled.night{background:var(--night-bg);}
  .day-cell.filled.night .tag{background:var(--night);color:#fff;}
  .day-cell.filled.half{background:var(--half-bg);}
  .day-cell.filled.half .tag{background:var(--half);color:#fff;}
  .day-cell.filled.mixed{background:#EDE7DC;border-color:var(--steel-light);}
  .day-cell.filled.mixed .tag{background:var(--steel);color:#fff;}

  /* Bottom sheet picker */
  .overlay{
    position:fixed;inset:0;
    background:rgba(20,26,30,0.55);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
  }
  .overlay.show{display:flex;}
  .picker{
    width:100%;
    max-width:600px;
    background:var(--paper-light);
    border-radius:14px 14px 0 0;
    padding:10px 20px 26px;
    box-shadow:0 -10px 40px rgba(0,0,0,0.35);
    animation:slideUp .2s ease;
  }
  @keyframes slideUp{ from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .picker-handle{
    width:36px;height:4px;background:var(--line);border-radius:2px;
    margin:0 auto 14px;
  }
  .picker-date{
    font-family:Georgia,serif;
    font-size:17px;
    text-align:center;
    margin-bottom:16px;
    color:var(--ink);
  }
  .picker-options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .picker-opt{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#fff;
    font-size:15px;
    cursor:pointer;
    transition:border-color .12s, box-shadow .12s;
  }
  .picker-opt:active{transform:scale(0.98);}
  .picker-opt .label-row{display:flex;align-items:center;gap:8px;font-weight:600;}
  .picker-opt .swatch{width:11px;height:11px;border-radius:3px;}
  .picker-opt.day .swatch{background:var(--day);}
  .picker-opt.ot .swatch{background:var(--ot);}
  .picker-opt.night .swatch{background:var(--night);}
  .picker-opt.half .swatch{background:var(--half);}
  .picker-opt.active{border-color:var(--steel);box-shadow:0 0 0 1px var(--steel) inset;background:var(--paper-light);}
  .base-hint{
    font-size:10.5px;
    font-weight:normal;
    color:var(--muted);
    font-family:'Courier New',monospace;
  }
  .opt-val{
    font-family:'Courier New',monospace;
    font-size:15px;
    font-weight:bold;
    color:var(--steel);
    min-width:30px;
    text-align:right;
  }
  .global-adjust{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:14px;
    padding:12px 14px;
    border:1px dashed var(--line);
    border-radius:8px;
    background:var(--paper-light);
  }
  .global-label{
    font-size:13px;
    color:var(--muted);
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .step-btn{
    width:34px;height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    background:#fff;
    font-size:18px;
    line-height:1;
    cursor:pointer;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    user-select:none;
  }
  .step-btn:active{transform:scale(0.9);}
  .step-btn.plus{border-color:var(--steel);color:var(--steel);}
  .step-btn:disabled{opacity:0.3;cursor:default;}
  .step-btn:disabled:active{transform:none;}
  .step-val{
    font-family:'Courier New',monospace;
    font-size:15px;
    min-width:34px;
    text-align:center;
    font-weight:bold;
    color:var(--ink);
  }
  .picker-total{
    text-align:center;
    margin-top:14px;
    font-size:13px;
    color:var(--muted);
    font-family:'Courier New',monospace;
  }
  .picker-total b{
    color:var(--steel);
    font-size:16px;
  }
  .picker-clear{
    margin-top:10px;
    text-align:center;
    font-size:13px;
    color:var(--danger);
    text-decoration:underline;
    cursor:pointer;
    padding:8px;
  }
  .picker-cancel{
    margin-top:4px;
    text-align:center;
    font-size:13px;
    color:var(--muted);
    cursor:pointer;
    padding:8px;
  }

  .mobile-tools{
    display:flex; flex-direction:column; gap:8px; padding:0 16px 22px;
  }
  .action-row{
    display:flex; gap:8px;
  }
  .mobile-tools button{
    flex:1; padding:12px; border:1px solid var(--line); border-radius:8px;
    background:var(--paper-light); color:var(--ink); font-size:13px; font-weight:600; cursor:pointer;
  }
  .mobile-tools button.install-btn{
    background:var(--steel); color:var(--paper-light); border:none; display:none;
  }
  .mobile-tools button:active{transform:scale(.98);}

  .loading{padding:60px 24px;text-align:center;color:var(--muted);font-family:'Courier New',monospace;}

  /* Quote popup */
  .quote-overlay{
    position:fixed;inset:0;
    background:rgba(20,26,30,0.68);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:300;
    padding:24px;
    cursor:pointer;
  }
  .quote-overlay.show{display:flex;}
  .quote-card{
    max-width:420px;
    width:100%;
    background:var(--paper-light);
    border-radius:6px;
    padding:34px 28px 28px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    animation:quoteIn .22s ease;
    cursor:default;
  }
  @keyframes quoteIn{ from{transform:translateY(10px) scale(0.97); opacity:0;} to{transform:translateY(0) scale(1); opacity:1;} }
  .quote-mark{
    font-family:Georgia,serif;
    font-size:40px;
    color:var(--ot);
    line-height:1;
    margin-bottom:4px;
  }
  .quote-text{
    font-family:Georgia,'Times New Roman',serif;
    font-size:18px;
    line-height:1.6;
    color:var(--ink);
    margin:0 0 18px;
  }
  .quote-tap{
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.3px;
    font-family:'Courier New',monospace;
  }
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--steel);color:var(--paper-light);
    padding:10px 18px;border-radius:20px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .25s;
    z-index:200; width:max-content; max-width:90%; text-align:center;
  }
  .toast.show{opacity:1;}

  @media (max-width:420px){
    .title{font-size:20px;}
    .total-strip .value{font-size:24px;}
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="header">
    <div class="header-top">
      <div>
        <p class="title">공수표<span class="en">MANHOUR LEDGER</span></p>
      </div>
    </div>
    <div class="legend">
      <div class="legend-item"><span class="legend-dot half"></span>반일 (0.5)</div>
      <div class="legend-item"><span class="legend-dot day"></span>주간 (1.0)</div>
      <div class="legend-item"><span class="legend-dot ot"></span>연장 (1.5)</div>
      <div class="legend-item"><span class="legend-dot night"></span>야간 (2.0)</div>
    </div>
  </div>

  <div class="month-nav">
    <button id="prevMonth">‹</button>
    <div class="month-label" id="monthLabel">-</div>
    <button id="nextMonth">›</button>
  </div>

  <div class="total-strip" id="totalStrip">
    <div class="loading">불러오는 중…</div>
  </div>

  <div class="calendar" id="calendar"></div>

  <!-- 백업/복원 및 홈 화면 바로가기 추가 버튼 -->
  <div class="mobile-tools">
    <button id="installApp" class="install-btn">📱 홈 화면에 바로가기 추가</button>
    <div class="action-row">
      <button id="exportData">데이터 백업</button>
      <button id="importData">데이터 복원</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none;" />
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="picker">
    <div class="picker-handle"></div>
    <div class="picker-date" id="pickerDate">-</div>
    <div class="picker-options" id="pickerOptions">
      <div class="picker-opt half" data-type="half">
        <span class="label-row"><span class="swatch"></span>반일<span class="base-hint">기본 0.5</span></span>
        <span class="opt-val" data-type="half"></span>
      </div>
      <div class="picker-opt day" data-type="day">
        <span class="label-row"><span class="swatch"></span>주간<span class="base-hint">기본 1.0</span></span>
        <span class="opt-val" data-type="day"></span>
      </div>
      <div class="picker-opt ot" data-type="ot">
        <span class="label-row"><span class="swatch"></span>연장<span class="base-hint">기본 1.5</span></span>
        <span class="opt-val" data-type="ot"></span>
      </div>
      <div class="picker-opt night" data-type="night">
        <span class="label-row"><span class="swatch"></span>야간<span class="base-hint">기본 2.0</span></span>
        <span class="opt-val" data-type="night"></span>
      </div>
    </div>
    <div class="global-adjust">
      <span class="global-label">선택 항목 값 조정</span>
      <div class="stepper">
        <button class="step-btn minus" id="globalMinus">−</button>
        <span class="step-val" id="globalVal">0.0</span>
        <button class="step-btn plus" id="globalPlus">+</button>
      </div>
    </div>
    <div class="picker-total" id="pickerTotal">이 날짜 합계: <b>0.0</b> 공수</div>
    <div class="picker-clear" id="pickerClear">이 날짜 기록 초기화</div>
    <div class="picker-cancel" id="pickerCancel">닫기</div>
  </div>
</div>

<div class="quote-overlay" id="quoteOverlay">
  <div class="quote-card">
    <div class="quote-mark">“</div>
    <p class="quote-text" id="quoteText"></p>
    <div class="quote-tap">화면을 탭하면 닫혀요</div>
  </div>
</div>

<div class="toast" id="toast"></div>

  const TYPES = {
    half:  { label:"반일", base:0.5 },
    day:   { label:"주간", base:1.0 },
    ot:    { label:"연장", base:1.5 },
    night: { label:"야간", base:2.0 }
  };
  const TYPE_ORDER = ["half","day","ot","night"];
  const STEP = 0.5;
  const MAX_VAL = 4.0;
  const MIN_YM = {y:2026, m:7};   // 2026-07
  const MAX_YM = {y:2026, m:12};  // 2026-12

  let curY = 2026, curM = 7;
  let monthData = {};
  let pickerDateStr = null;
  let pickerRecord = null;
  let deferredPrompt = null;

  function pad(n){ return String(n).padStart(2,'0'); }
  function dateStr(y,m,d){ return `${y}-${pad(m)}-${pad(d)}`; }
  function monthKey(y,m){ return `gs-month:${y}-${pad(m)}`; }
  function emptyRecord(){ return { half:0, day:0, ot:0, night:0 }; }
  function recordTotal(rec){
    if(!rec) return 0;
    return TYPE_ORDER.reduce((s,t)=> s + (Number(rec[t])||0), 0);
  }
  function activeTypes(rec){
    if(!rec) return [];
    return TYPE_ORDER.filter(t => (Number(rec[t])||0) > 0);
  }

  function showToast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2500);
  }

  async function loadMonth(y,m){
    try{
      const res = await storage.get(monthKey(y,m), false);
      if(res && res.value){ return JSON.parse(res.value); }
    }catch(e){ /* not found */ }
    return {};
  }
  async function saveMonth(y,m,data){
    try{
      await storage.set(monthKey(y,m), JSON.stringify(data), false);
    }catch(e){ showToast("저장 실패 – 다시 시도해주세요"); console.error(e); }
  }

  function ymLabel(y,m){ return `${y}년 ${m}월`; }
  function isAtMin(y,m){ return y===MIN_YM.y && m===MIN_YM.m; }
  function isAtMax(y,m){ return y===MAX_YM.y && m===MAX_YM.m; }

  function renderTotal(){
    let total = 0;
    const sums = { half:0, day:0, ot:0, night:0 };
    Object.values(monthData).forEach(rec=>{
      TYPE_ORDER.forEach(t=>{
        const v = Number(rec[t])||0;
        sums[t] += v;
        total += v;
      });
    });
    const el = document.getElementById('totalStrip');
    el.innerHTML = `
      <div>
        <div class="label">${ymLabel(curY,curM)} 총 공수</div>
        <div class="value">${total.toFixed(1)}<span class="unit">공수</span></div>
      </div>
      <div class="total-breakdown">
        <span>반일 <b>${sums.half.toFixed(1)}</b></span>
        <span>주간 <b>${sums.day.toFixed(1)}</b></span>
        <span>연장 <b>${sums.ot.toFixed(1)}</b></span>
        <span>야간 <b>${sums.night.toFixed(1)}</b></span>
      </div>
    `;
  }

  function renderCalendar(){
    const el = document.getElementById('calendar');
    const dowNames = ['일','월','화','수','목','금','토'];
    let html = `<div class="dow-row">${dowNames.map(d=>`<div>${d}</div>`).join('')}</div>`;
    html += `<div class="day-grid">`;

    const firstDow = new Date(curY, curM-1, 1).getDay();
    const daysInMonth = new Date(curY, curM, 0).getDate();

    const today = new Date();
    const isCurrentMonth = today.getFullYear()===curY && (today.getMonth()+1)===curM;

    for(let i=0;i<firstDow;i++){
      html += `<div class="day-cell empty"></div>`;
    }
    for(let d=1; d<=daysInMonth; d++){
      const dow = new Date(curY, curM-1, d).getDay();
      const ds = dateStr(curY,curM,d);
      const rec = monthData[ds];
      const active = activeTypes(rec);
      const total = recordTotal(rec);
      let cls = "day-cell";
      if(dow===0) cls += " sunday";
      if(isCurrentMonth && today.getDate()===d) cls += " today";
      if(active.length===1) cls += ` filled ${active[0]}`;
      else if(active.length>1) cls += ` filled mixed`;
      html += `<div class="${cls}" data-date="${ds}" data-day="${d}">
        <span class="num">${d}</span>
        ${total>0 ? `<span class="tag">${total.toFixed(1)}</span>` : ''}
      </div>`;
    }
    el.innerHTML = html;

    el.querySelectorAll('.day-cell[data-date]').forEach(cell=>{
      cell.onclick = ()=> openPicker(cell.getAttribute('data-date'), cell.getAttribute('data-day'));
    });
  }

  function getSelectedType(){
    return TYPE_ORDER.find(t => (Number(pickerRecord[t])||0) > 0) || null;
  }

  function renderPicker(){
    const selected = getSelectedType();
    TYPE_ORDER.forEach(t=>{
      const val = Number(pickerRecord[t])||0;
      document.querySelector(`.picker-opt[data-type="${t}"]`).classList.toggle('active', val>0);
      document.querySelector(`.opt-val[data-type="${t}"]`).textContent = val>0 ? val.toFixed(1) : '';
    });
    const gVal = selected ? Number(pickerRecord[selected])||0 : 0;
    document.getElementById('globalVal').textContent = gVal.toFixed(1);
    document.getElementById('globalMinus').disabled = !selected;
    document.getElementById('globalPlus').disabled = !selected;
    document.getElementById('pickerTotal').innerHTML =
      `이 날짜 합계: <b>${recordTotal(pickerRecord).toFixed(1)}</b> 공수`;
  }

  function openPicker(ds, dayNum){
    pickerDateStr = ds;
    pickerRecord = Object.assign(emptyRecord(), monthData[ds] || {});
    document.getElementById('pickerDate').textContent = `${curY}년 ${curM}월 ${dayNum}일`;
    renderPicker();
    document.getElementById('overlay').classList.add('show');
  }

  async function persistPicker(){
    if(!pickerDateStr) return;
    if(recordTotal(pickerRecord) > 0){
      monthData[pickerDateStr] = Object.assign({}, pickerRecord);
    } else {
      delete monthData[pickerDateStr];
    }
    await saveMonth(curY, curM, monthData);
    renderCalendar();
    renderTotal();
  }

  function showQuote(){
    const q = QUOTES[Math.floor(Math.random()*QUOTES.length)];
    document.getElementById('quoteText').textContent = q;
    document.getElementById('quoteOverlay').classList.add('show');
  }

  document.getElementById('quoteOverlay').onclick = ()=>{
    document.getElementById('quoteOverlay').classList.remove('show');
  };

  function closePicker(){
    document.getElementById('overlay').classList.remove('show');
    pickerDateStr = null;
    pickerRecord = null;
    setTimeout(showQuote, 200);
  }

  document.querySelectorAll('.picker-opt').forEach(opt=>{
    opt.onclick = async ()=>{
      if(!pickerRecord) return;
      const type = opt.getAttribute('data-type');
      const cur = Number(pickerRecord[type])||0;
      TYPE_ORDER.forEach(t=>{ pickerRecord[t] = 0; });
      if(cur === 0){
        pickerRecord[type] = TYPES[type].base;
      }
      renderPicker();
      await persistPicker();
    };
  });

  document.getElementById('globalPlus').onclick = async ()=>{
    const type = getSelectedType();
    if(!type) return;
    let next = Math.min(MAX_VAL, (Number(pickerRecord[type])||0) + STEP);
    pickerRecord[type] = next;
    renderPicker();
    await persistPicker();
  };
  document.getElementById('globalMinus').onclick = async ()=>{
    const type = getSelectedType();
    if(!type) return;
    let next = Math.max(0, (Number(pickerRecord[type])||0) - STEP);
    pickerRecord[type] = next;
    renderPicker();
    await persistPicker();
  };
  document.getElementById('pickerClear').onclick = async ()=>{
    if(!pickerDateStr) return;
    pickerRecord = emptyRecord();
    renderPicker();
    await persistPicker();
  };
  document.getElementById('pickerCancel').onclick = closePicker;
  document.getElementById('overlay').onclick = (e)=>{
    if(e.target.id === 'overlay') closePicker();
  };

  async function goToMonth(y,m){
    curY = y; curM = m;
    document.getElementById('monthLabel').textContent = ymLabel(y,m);
    document.getElementById('prevMonth').disabled = isAtMin(y,m);
    document.getElementById('nextMonth').disabled = isAtMax(y,m);
    document.getElementById('totalStrip').innerHTML = '<div class="loading">불러오는 중…</div>';
    monthData = await loadMonth(y,m);
    renderTotal();
    renderCalendar();
  }

  document.getElementById('prevMonth').onclick = ()=>{
    if(isAtMin(curY,curM)) return;
    let y=curY, m=curM-1;
    if(m<1){ m=12; y--; }
    goToMonth(y,m);
  };
  document.getElementById('nextMonth').onclick = ()=>{
    if(isAtMax(curY,curM)) return;
    let y=curY, m=curM+1;
    if(m>12){ m=1; y++; }
    goToMonth(y,m);
  };

  // 백업 및 복원
  document.getElementById('exportData').onclick = ()=>{
    const data = {};
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('gs-month:')) data[k] = localStorage.getItem(k);
    }
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '공수표-백업.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    showToast("백업 파일을 저장했습니다");
  };

  document.getElementById('importData').onclick = ()=>{
    document.getElementById('importFile').click();
  };

  document.getElementById('importFile').onchange = async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    try{
      const data = JSON.parse(await file.text());
      let count = 0;
      Object.entries(data).forEach(([k,v])=>{
        if(k.startsWith('gs-month:')){
          localStorage.setItem(k, v);
          count++;
        }
      });
      await goToMonth(curY,curM);
      showToast(`${count}개월 데이터를 복원했습니다`);
    }catch(err){
      showToast("복원 파일을 읽지 못했습니다");
      console.error(err);
    }
    e.target.value = "";
  };

  // PWA 홈 화면 바로가기 추가 처리
  const installBtn = document.getElementById('installApp');
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

  if (!isStandalone) {
    installBtn.style.display = 'block';
  }

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'block';
  });

  installBtn.onclick = async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.style.display = 'none';
      }
      deferredPrompt = null;
    } else {
      const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isiOS) {
        showToast("Safari 하단 [공유] 버튼 클릭 후 '홈 화면에 추가'를 눌러주세요.");
      } else {
        showToast("브라우저 메뉴(⋮)에서 '홈 화면에 추가' 또는 '앱 설치'를 눌러주세요.");
      }
    }
  };

  // 초기화
  (async function init(){
    let startY = 2026, startM = 7;
    const today = new Date();
    if(today.getFullYear()===2026 && today.getMonth()+1>=7 && today.getMonth()+1<=12){
      startM = today.getMonth()+1;
    }
    await goToMonth(startY, startM);
  })();
})();
</script>
